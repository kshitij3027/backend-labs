# The load balancer that makes this project's central claim observable (Commit C12).
#
# Two byte-identical `api` replicas, one Redis, one nginx in front round-robining between them.
# Nothing here is load bearing for *correctness* — the limiter is correct because every
# read-modify-write happens inside one Lua script on Redis's single thread — but this file is what
# makes the claim CHECKABLE from outside: 20 curls at :8020/health return two distinct
# `served_by` hostnames, and the same 20 requests against a metered route are charged against ONE
# bucket. Without a real load balancer in front, "two replicas share one limiter" is a sentence in
# a README rather than a property a shell loop can falsify.
#
# Mounted read-only at /etc/nginx/nginx.conf, so this is the WHOLE configuration: the stock
# image's `include /etc/nginx/conf.d/*.conf` is deliberately absent, which is also what keeps the
# stock `default.conf` welcome page from claiming :80 alongside the `server` block below.
#
# .. rubric:: THE hard requirement: this proxy must NOT add a path prefix
#
# `src.middleware.RateLimitMiddleware` decides what a request *is* from
# `starlette.routing.get_route_path(scope)` — the same accessor Starlette's own router uses. That
# string is compared literally against the exempt allowlist. If this file forwarded requests under
# a prefix (`proxy_pass http://api_pool/gw/;`, or a `location /gw/` that did not strip itself),
# `/health` would arrive at the app as `/gw/health`, miss `is_exempt`, and be METERED — which
# means 401, because the container HEALTHCHECK carries no credential. Compose reads a non-200 from
# the healthcheck as "restart this replica", so a one-character path mistake here restart-loops
# two replicas that are serving perfectly, and the traceback points at a rate limiter.
#
# The same prefix produces a second, quieter bug at the other end of the same list: a prefixed
# `/gw/api/v1/logs/query` is still served by the expensive handler but classifies as
# `("other", "default")` — 1 token instead of 5, charged to a bucket that has nothing to do with
# the endpoint being used. `src.api.protected.verify_route_pricing` cannot catch it, because it
# compares path *templates* and a template is prefix-independent.
#
# So: `location /` and a `proxy_pass` with **no URI part**, which is nginx's spelling for "pass
# the request URI through unchanged". Both halves matter — `proxy_pass http://api_pool;` passes
# `$request_uri` verbatim, while `proxy_pass http://api_pool/;` would rewrite it. There is one
# trailing slash between this file and a healthcheck restart loop.

user  nginx;

# `auto` = one worker per core. This process does nothing but shuttle bytes between two sockets;
# the interesting concurrency lives in uvicorn and in Redis's single thread.
worker_processes  auto;

error_log  /var/log/nginx/error.log  notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Straight to the container's stdout, so `make logs` interleaves the LB's view of a request
    # with the two replicas' views of the same request. `$upstream_addr` is the field that makes
    # the log worth reading here: it names WHICH replica served each line, which is the same
    # question `served_by` answers in the /health body and the one this whole commit is about.
    log_format  upstream  '$remote_addr - "$request" $status '
                          'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log  /dev/stdout  upstream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Do not advertise the exact nginx patch level to every caller. Free, and one fewer line in
    # somebody's scanner output.
    server_tokens   off;

    # -------------------------------------------------------------------------------------- #
    # The replica pool
    #
    # Two NAMED servers rather than `deploy: replicas: 2`, and the reason is downstream: C13's
    # verifier needs to address ONE replica directly (`DIRECT_URL=http://api1:8000`) as the
    # single-replica control for the double-spend check. If the control says "60 admitted" and
    # the load-balanced run says "120 admitted", the shared-state claim is false — and that
    # comparison is only possible if one replica has a stable name.
    #
    # Default strategy, deliberately: plain round-robin, no `ip_hash`, no `least_conn`, no sticky
    # anything. Session affinity would be the natural production choice and is exactly wrong here:
    # pinning a client to one replica would make a single caller's traffic land on a single
    # process, and every distributed assertion in this project would pass while proving nothing.
    # The fan-out IS the test subject.
    #
    # These hostnames are resolved ONCE, at startup, from Docker's embedded DNS. That is why the
    # `lb` service waits on `condition: service_healthy` for both replicas: nginx refuses to start
    # at all with "host not found in upstream", rather than starting and retrying, so a race with
    # container startup is a hard failure and not a flaky one.
    #
    # `max_fails`/`fail_timeout`: after 3 consecutive connection failures a replica is taken out
    # of rotation for 10s and requests go to its sibling. Combined with `proxy_next_upstream`
    # below, that means one dead replica degrades throughput and nothing else — which is the
    # property `docker compose stop api2` should demonstrate.
    upstream api_pool {
        # Shared-memory zone, and it is not an optimisation — it is what makes the fan-out EVEN
        # rather than merely present. Without a `zone`, each of the `worker_processes auto`
        # workers keeps its own private copy of the round-robin cursor, so the split across two
        # replicas is only balanced on average and by accident. Measured on this machine before
        # this line existed: 20 sequential /health probes came back 13/7 instead of 10/10, because
        # the probes were spread over several workers each starting its own rotation (and the LB's
        # own healthcheck was shifting one of them).
        #
        # 13/7 still satisfies "two distinct replicas answered", which is the property. It is a bad
        # BASELINE though: C14 Phase D measures load-balanced throughput against a single replica
        # and gates on a ratio, and a skewed split puts one replica's queue ahead of the other's
        # for no reason the measurement can see. One shared cursor, one rotation.
        zone api_pool 64k;

        server api1:8000 max_fails=3 fail_timeout=10s;
        server api2:8000 max_fails=3 fail_timeout=10s;

        # Keep up to 32 idle upstream connections alive. Without this, every proxied request pays
        # a fresh TCP handshake to uvicorn — pure overhead on the one measurement C14 exists to
        # take (limiter overhead, budgeted at 5 ms), and overhead attributed to the limiter rather
        # than to the proxy. Requires HTTP/1.1 and an emptied `Connection` header on the upstream
        # request; both are set in the location below.
        #
        # It does NOT weaken the fan-out: nginx still picks the next upstream per REQUEST and only
        # reuses a socket once that choice is made. Verified by the /health probe loop, which
        # opens 20 separate client connections and still sees both hostnames.
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # The whole API is one origin: /health, /api/v1/*, /docs, /dashboard and (C15) /static all
        # come from the same uvicorn process. One location, no rewriting, no exceptions — an
        # exception here would be a path whose spelling differs between what the proxy forwards and
        # what the middleware exempts, which is the failure this file's header rubric is about.
        location / {
            # NO URI part after the upstream name. See the rubric at the top of this file: this is
            # the line that keeps `/health` spelled `/health` on the far side of the hop.
            proxy_pass http://api_pool;

            # HTTP/1.1 + an emptied `Connection` is the prerequisite for the `keepalive` above.
            # Left at nginx's HTTP/1.0 default, upstream keepalive is silently ignored.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # The four headers the app cannot reconstruct once the request has been proxied.
            # `$host` rather than a literal, so a request to any hostname reaches the app naming
            # the host the CLIENT used — FastAPI builds `/docs`'s absolute URLs from it.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # NOTHING about the three credential headers appears here, and that is correct rather
            # than an omission: nginx forwards every request header it was not explicitly told to
            # change, so `X-API-Key`, `Authorization` and `X-Admin-Token` survive the hop
            # untouched. `proxy_set_header`-ing them would be a second definition of what the app
            # already reads.
            #
            # The ONE nginx default that silently eats headers is `underscores_in_headers off`,
            # which DROPS any request header containing an underscore. None of this project's
            # headers use one — they are all hyphenated (`X-API-Key`, not `X_API_KEY`) — so the
            # default stands. It is noted rather than "fixed" because turning underscores on would
            # be papering over a header this service does not have; if one is ever added, this is
            # the line that explains why it arrived empty and the app answered 401.

            # Retry the sibling replica on a CONNECTION-level failure only. `http_429` and
            # `http_503` are deliberately NOT in this list, and it is the most important line in
            # the file after `proxy_pass`: those two statuses are the limiter DECIDING, and a
            # retry would re-run a metered request against the other replica — charging the caller
            # twice for one logical call and manufacturing, at the proxy, the exact double-spend
            # this project exists to measure. A 429 must reach the client as a 429.
            proxy_next_upstream       error timeout;
            proxy_next_upstream_tries 2;

            # Sane, and short. The limiter's own budget is 5 ms and the slowest thing behind this
            # proxy is a 250 ms Redis timeout, so a request that takes 30 s has not been slow, it
            # has hung — and holding the connection open longer only delays the client's retry.
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Buffering left ON (nginx's default) and stated rather than assumed. Every response
            # this API produces is a small JSON document, so buffering frees the uvicorn worker as
            # soon as it has written the body instead of holding it for a slow client. The buffers
            # are sized for that shape; nothing here streams, so there is no long-poll or SSE
            # response for buffering to stall. C15's dashboard polls, it does not stream.
            proxy_buffering  on;
            proxy_buffers    8 8k;
            proxy_buffer_size  8k;

            # Rate-limit headers ride through untouched: nginx passes upstream response headers
            # through by default and `proxy_hide_header` is used nowhere in this file. That is
            # what makes the E2E assertion meaningful — `X-RateLimit-Remaining` read through the
            # LB is the number the replica actually computed, not one the proxy re-derived.
            #
            # Note what is deliberately NOT added here: an `X-Served-By` synthesised from
            # `$upstream_addr`. The app owns that header name (it is already in
            # `src.main.EXPOSE_HEADERS`), and a proxy-added copy would become a SECOND value for
            # the same header the moment the app starts emitting one — two contradictory values
            # for one header is the failure `src.middleware` refuses to introduce on
            # `X-RateLimit-Remaining`, and a client takes whichever its parser reaches first.
            # Replica identity is observable today through `served_by` in the /health body.
        }
    }
}
