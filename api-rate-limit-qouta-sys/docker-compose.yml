# API Rate Limiter & Quota Manager — service topology (Commit C12).
#
# Four services now: `redis` (the shared store), `api1` + `api2` (two byte-identical uvicorn
# processes, neither published on the host) and `lb` (nginx, round-robining between them and
# owning the only host port). C1 shipped a single `api` and said this split was coming; nothing
# else about the topology changed to accommodate it, because the reason there were two services
# rather than one was already true then.
#
# .. rubric:: Why Redis is its own service, and not a dict in the app
#
# The limiter's state MUST live outside the API process. A token bucket held in Python memory is
# not a rate limit once there are two replicas behind a load balancer — it is TWO rate limits,
# and the caller gets double the allowance they paid for. The same applies, worse, to quota
# counters: a per-process daily counter means N replicas each hand out the full daily allowance.
# So buckets, sliding-window counters and quota counters all live in this one Redis, every
# read-modify-write against them is a single server-side Lua script (atomic on Redis's single
# thread), and the clock they refill against is `redis.call('TIME')` — ONE clock, so a replica
# with a fast system clock cannot refill its own bucket early. Redis being a separate container
# is what makes that property visible and testable rather than merely intended.
#
# As of this commit that sentence is no longer hypothetical: `api1` and `api2` are two real
# processes with two real connection pools, and `for i in $(seq 1 20); do curl -s
# localhost:8020/health; done | ...` returns TWO distinct `served_by` hostnames. Every claim in
# the paragraph above is now falsifiable from a shell loop rather than only from a unit test.
#
# The profile-gated `test` service runs the pytest suite from Dockerfile.test; `e2e` (C13) and
# `loadtest` (C14) run the two black-box harnesses from the same image, and C14 adds one more
# process — `api-baseline`, an `api1` with RATE_LIMIT_ENABLED=false that exists only to be measured
# against. None of them starts on a bare `docker compose up`. The harnesses reach the API by SERVICE
# NAME over the compose network (http://lb:80, with http://api1:8000 as the single-replica control
# and http://api-baseline:8000 as the unmetered one), never via a published host port, so they are
# immune to an API_PORT collision on the host.
#
# Every one of the 29 Settings fields is passed to both replicas as ${VAR:-default}, including the
# ones no code reads until C13-C15. That is deliberate: the whole config surface is
# host-overridable from day one and this file never has to change again as later commits start
# reading those keys.

# ---------------------------------------------------------------------------------------------
# The replica template.
#
# `api1` and `api2` are the SAME service twice, and the anchor is what makes that a structural
# fact rather than two blocks a reviewer has to diff by eye. The environment block in particular
# must be identical across replicas or the system stops being one system:
#
#   * A different API_KEY_PEPPER per replica means the same API key hashes to a different digest
#     on each, so a caller authenticates against api1 and gets a 401 from api2 — identity would
#     become replica-dependent, which is indistinguishable from an intermittent auth outage.
#   * A different JWT_SECRET means a token minted for one replica is a forgery to the other.
#   * A different ADMIN_TOKEN means the control plane answers only half the time.
#   * A different TIER_LIMITS means the two replicas seed and enforce different ceilings, so the
#     answer to "what is this caller's limit?" depends on which one the LB picked.
#
# YAML merge keys (`<<: *api`) rather than `deploy: replicas: 2`, because C13's double-spend check
# needs to address ONE replica directly as its single-replica control, and `deploy.replicas`
# produces compose-generated names nothing can address stably.
# ---------------------------------------------------------------------------------------------
x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  # An operator-supplied .env is optional: `required: false` keeps a clean clone runnable.
  env_file:
    - path: .env
      required: false
  environment:
    # --- Server / logging ---
    - LOG_LEVEL=${LOG_LEVEL:-INFO}

    # --- Shared state (C2) ---
    - "REDIS_URL=${REDIS_URL:-redis://redis:6379/0}"
    - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-32}
    # 250 ms, on BOTH connect and socket read. The rate-limit check has a 5 ms budget, so a
    # Redis that has stopped answering must be classified as failed in milliseconds, not
    # seconds — a limiter that hangs is worse for the caller than one that fails open.
    - REDIS_TIMEOUT_MS=${REDIS_TIMEOUT_MS:-250}

    # --- Secrets (C5, C10) ---
    # Dev-only values — NOT secrets, and deliberately not any of the placeholder strings
    # Settings rejects, so `make up` works on a clean clone with no .env at all. Override via
    # .env or the shell (`JWT_SECRET=$(openssl rand -hex 32)`) for anything not a laptop.
    #
    # Every one of these resolves ONCE, here in the anchor, so both replicas necessarily get the
    # same value — see the rubric above for what each divergence would break.
    - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-signing-key-0123456789abcdef}
    - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    - ACCESS_TOKEN_TTL_MIN=${ACCESS_TOKEN_TTL_MIN:-30}
    # The pepper for the HMAC-SHA256 API-key digests. It lives HERE, in the app's environment,
    # and never in Redis — so a stolen Redis dump on its own yields digests an attacker cannot
    # invert into usable keys. Rotating it invalidates every stored key by construction.
    - API_KEY_PEPPER=${API_KEY_PEPPER:-dev-only-insecure-pepper-0123456789abcdef}
    - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-only-insecure-admin-token-0123456789abcdef}

    # --- Limits and quotas (C3, C4) ---
    - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
    # Quoted: the value is `tier:rpm:burst:daily:monthly,...` and YAML would otherwise have to
    # be trusted with a string full of colons.
    - "TIER_LIMITS=${TIER_LIMITS:-free:60:60:1000:25000,premium:300:300:50000:1250000,enterprise:1000:1000:500000:12500000}"
    - DEFAULT_TIER=${DEFAULT_TIER:-free}
    # Weighted per-request cost by endpoint category (the in-scope bonus). Quoted for the
    # same reason as TIER_LIMITS.
    - "ENDPOINT_COSTS=${ENDPOINT_COSTS:-logs_query:5,logs_ingest:2,default:1}"
    - BUCKET_TTL_SEC=${BUCKET_TTL_SEC:-3600}
    - SLIDING_WINDOW_SEC=${SLIDING_WINDOW_SEC:-60}
    - SLIDING_WINDOW_ENABLED=${SLIDING_WINDOW_ENABLED:-true}
    - QUOTA_DAILY_ENABLED=${QUOTA_DAILY_ENABLED:-true}
    - QUOTA_MONTHLY_ENABLED=${QUOTA_MONTHLY_ENABLED:-true}
    # The bound on how long a tier DEFINITION change takes to reach the replica that did not
    # serve the write. `PUT /admin/users/{id}/tier` has no such bound — who is on which tier is
    # read inside the Lua script on every request — and the two-replica integration test asserts
    # exactly that asymmetry.
    - TIER_CACHE_TTL_SEC=${TIER_CACHE_TTL_SEC:-5}

    # --- Analytics (C9, C11) ---
    - ANALYTICS_MINUTE_TTL_SEC=${ANALYTICS_MINUTE_TTL_SEC:-3600}
    - ANALYTICS_HOUR_TTL_SEC=${ANALYTICS_HOUR_TTL_SEC:-604800}
    - ANALYTICS_MAX_BUCKETS=${ANALYTICS_MAX_BUCKETS:-120}

    # --- Degradation (C8) ---
    - FAIL_MODE=${FAIL_MODE:-open}
    # Sizes the degraded fallback bucket at ceil(tier_capacity / API_REPLICAS). It must track
    # the number of `api*` services below — there are exactly TWO as of this commit, and adding a
    # third without changing this number would give the three of them 3 x ceil(cap/2) between them
    # during an outage: the N-times overspend this project exists to prevent, arriving through a
    # config value nobody re-read.
    - API_REPLICAS=${API_REPLICAS:-2}
    - BREAKER_FAILURES=${BREAKER_FAILURES:-5}
    - BREAKER_COOLDOWN_SEC=${BREAKER_COOLDOWN_SEC:-5}

    # --- Test-only seam, inert in production (C4) ---
    # Gates the Lua script's `now_ms_override` ARGV. Default false, and it stays false here:
    # a caller-supplied clock is precisely the skew vulnerability the design removed, so it
    # must be inert by construction outside the tests that need a frozen clock.
    - ALLOW_CLOCK_OVERRIDE=${ALLOW_CLOCK_OVERRIDE:-false}

    # --- Dashboard (C15) ---
    - DASHBOARD_POLL_MS=${DASHBOARD_POLL_MS:-5000}

    # --- CORS ---
    - CORS_ORIGINS=${CORS_ORIGINS:-*}
  depends_on:
    # Wait for `redis-cli ping`, not merely for the container to exist. Starting the API
    # against a Redis that is not answering yet would make the first seconds of every `make up`
    # run in the degraded fail-open path — i.e. unmetered — which is exactly the state this
    # project is built to make visible rather than accidental.
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    # /health is dependency-proof, unauthenticated and never metered, so the app is healthy as
    # soon as uvicorn binds; 20s covers pool construction without flapping the container.
    #
    # "never metered" is load bearing for the whole topology and is the property the LB config is
    # written around: this probe carries no credential, so if a proxy prefix ever made `/health`
    # miss the middleware's exempt list, this line would start collecting 401s and compose would
    # restart two replicas that are serving perfectly. See nginx/nginx.conf.
    start_period: 20s
  # Trade-off, accepted deliberately: a FATAL config error (e.g. a placeholder JWT_SECRET,
  # which Settings rejects at import) restart-loops here rather than stopping once — compose
  # cannot distinguish "crashed transiently" from "will never start". The refusal contract
  # still holds (the container never serves a request with a bad key, and `docker compose up`
  # surfaces `exited with code 1` on every cycle), and auto-recovery from transient crashes is
  # worth more day to day than a clean exit on a misconfiguration you see immediately anyway.
  restart: unless-stopped

services:
  # Shared state. ONE bucket, ONE quota counter, ONE clock, for however many API replicas exist.
  redis:
    image: redis:7-alpine
    # appendonly=yes, and this is a correctness choice rather than a default worth inheriting.
    # A Redis restart without AOF resets every daily and monthly QUOTA counter to zero — a
    # customer who has burned 90% of a paid monthly allowance gets it back for free, which is a
    # billing-shaped hole rather than a cache miss. Losing token BUCKETS on restart is fine and
    # expected: buckets are ephemeral by design (they refill continuously, carry a ~1 h TTL, and
    # an empty bucket recovers within a minute), so the worst case there is one brief window of
    # extra burst headroom. Persistence is bought for the counters that represent money.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      # `redis-cli ping` rather than a TCP port probe: the port is listening well before the
      # server is ready to answer commands, and the replicas' depends_on below waits on THIS.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Named volume, so the AOF survives `docker compose down` (only `down -v` — i.e. `make
    # clean` and the test targets — discards it). Tests deliberately start from a clean store.
    volumes:
      - redis-data:/data

  # Replica 1. Identical to `api2` in every respect except its name — see the `x-api` anchor.
  #
  # No `ports:`. NEITHER replica publishes a host port, and that is the point of this commit
  # rather than tidiness: a published port on `api1` would let a developer (or a benchmark, or a
  # `curl` in a README) address one replica directly and conclude the limiter works, having
  # exercised exactly the single-process configuration whose correctness was never in doubt. The
  # only way in from the host is through the LB, so the default way to use this project is the
  # distributed one.
  #
  # `api1` is still reachable BY NAME over the compose network (`http://api1:8000`), which is what
  # C13 uses for its single-replica control — deliberately from inside the network, where only the
  # harness can go.
  api1:
    <<: *api

  # Replica 2. Same image, same environment, same everything. If these two blocks ever stop being
  # a merge key each, that is the bug.
  api2:
    <<: *api

  # The load balancer, and the only service on a host port.
  #
  # Round-robin over api1:8000 and api2:8000. `nginx:alpine` with the config bind-mounted
  # read-only rather than baked into an image: there is no build step for a 150-line text file,
  # and mounting it means `make up` after an edit re-reads it without a rebuild.
  lb:
    image: nginx:alpine
    volumes:
      # Read-only, and mounted OVER the stock nginx.conf rather than dropped into conf.d/. The
      # file is therefore the complete configuration (it carries its own `events`/`http` blocks),
      # which also stops the image's default `conf.d/default.conf` welcome page from binding :80.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # 8020 because sibling projects in this repo already hold 8000/8001/8010/8080. The container
    # side is nginx's :80; the replicas' :8000 is now an internal detail nothing on the host sees.
    ports:
      - "${API_PORT:-8020}:80"
    depends_on:
      # BOTH replicas, and `service_healthy` rather than `service_started`. nginx resolves the
      # names in its `upstream` block ONCE, at startup, and exits with "host not found in
      # upstream" if either is missing — it does not start and retry. Waiting on the healthcheck
      # rather than on container creation also means the first request through the LB cannot land
      # on a process that has not finished building its Redis pool.
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    healthcheck:
      # busybox `wget`, because nginx:alpine has NO curl — the production image installs it, this
      # one does not, and a `CMD curl` here would fail with "executable file not found" on every
      # probe and mark a perfectly healthy LB unhealthy forever.
      #
      # The probe goes through the proxy to a real replica rather than to a local stub, so "lb is
      # healthy" means "the LB can reach at least one replica", which is the only reading worth
      # having. One dead replica does not fail it: `proxy_next_upstream error timeout` moves the
      # probe to the sibling.
      #
      # `127.0.0.1`, NOT `localhost`, and the difference is the whole probe. The container's
      # /etc/hosts maps `localhost` to both 127.0.0.1 and ::1, busybox wget tries ::1 first, and
      # nginx/nginx.conf says `listen 80` — which binds IPv4 only. So the probe answered
      # "Connection refused" on every interval while the proxy was serving the host perfectly, and
      # the container sat at `health: starting` until it went `unhealthy` five probes later. It was
      # invisible from the host (the published port maps to the IPv4 socket) and it is exactly what
      # C13's `depends_on: lb: service_healthy` waits on, so it fails `make e2e` before check 1.
      # Fixed here rather than by adding `listen [::]:80` to nginx.conf: the probe is the thing that
      # was wrong about which address it meant, and the proxy has no reason to bind a second stack.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Short, because `depends_on` already waited for both replicas: by the time this container
      # exists there is something behind it to answer.
      start_period: 5s
    restart: unless-stopped

  # Unit + integration suite. Builds the tester image (Dockerfile.test ships the same code and
  # requirements as the replicas, plus tests/ + scripts/ and the two config files) and runs
  # pytest. Profile-gated so it never starts on a bare `docker compose up`. Run via `make test`.
  #
  # It waits on Redis because from C2 the integration suite asserts gateway and (from C4) Lua
  # behaviour against a REAL redis:7-alpine rather than against fakeredis. fakeredis is a
  # reimplementation — its TIME, float coercion and Lua->RESP rules are approximations, which is
  # precisely the wrong oracle for a script whose entire job is exactness. The NOSCRIPT-recovery
  # test in tests/integration/test_redis_gateway.py is the concrete example: it issues a real
  # `SCRIPT FLUSH` and re-runs, which only means anything against a real script cache.
  #
  # It deliberately does NOT depend on `lb`, `api1` or `api2`. The suite builds its apps in-process
  # through `httpx.ASGITransport` — including C12's two-replica test, which constructs two apps
  # with two gateways and two pools against this same Redis — so the only container it needs is
  # the store. Booting the live stack to run unit tests would make `make test` slower and would
  # couple a green suite to a healthy proxy.
  #
  # REDIS_URL is the ONE variable the suite needs from compose: tests/integration/conftest.py
  # reads it (defaulting to this same value) to point its gateway fixture at this service.
  #
  # Note what is NOT set here: JWT_SECRET / API_KEY_PEPPER / ADMIN_TOKEN. tests/conftest.py sets
  # them with os.environ.setdefault before `src` is imported, so the suite carries its own
  # credentials and behaves identically inside this container and in a bare `pytest` run. One
  # declaration, in the file the tests actually read.
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: [test]
    environment:
      - "REDIS_URL=redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy
    # No -q: verbosity is centralized in pytest.ini (`addopts = -q --tb=short`). A second -q here
    # would stack to -qq and suppress the "N passed in Xs" summary line.
    command: ["pytest"]

  # Black-box E2E verifier (C13). Same tester image, running scripts/verify_e2e.py against the LIVE
  # stack over HTTP only. Profile-gated so it never starts on a bare `docker compose up`; run via
  # `make e2e`.
  #
  # TWO base URLs, and the pair is the point of this service:
  #
  #   * TARGET_URL=http://lb:80    — through the load balancer, so a burst is round-robined across
  #     BOTH replicas. This is where the distributed double-spend check fires.
  #   * DIRECT_URL=http://api1:8000 — ONE replica, addressed directly, for the single-replica
  #     control run. Without it, "the LB admitted 60" is an observation; with it, it is an
  #     experiment — if one replica admits 60 and two admit 120, the shared-state claim is false.
  #
  # Both by SERVICE NAME over the compose network, never via a published host port. Neither replica
  # publishes one (that is C12's whole point), and reaching `lb` by name rather than through
  # ${API_PORT} makes this immune to a host port collision with a sibling project.
  #
  # The three secrets below are declared with the SAME ${VAR:-default} expressions as the `x-api`
  # anchor, and they have to be:
  #
  #   * JWT_SECRET — the verifier signs its own throwaway principals with src.identity.issue_token,
  #     so a different key here means every token it mints is a forgery to the replicas and check 3
  #     fails with a 401 that looks like an identity bug.
  #   * ADMIN_TOKEN — it drives the control plane (tier assignment, the quota and hot-reload
  #     checks, the usage read-back that proves a rejected request burned nothing).
  #   * API_KEY_PEPPER — never used by the verifier, but `Settings` REFUSES TO CONSTRUCT without
  #     it, so omitting it would fail the bootstrap before check 1.
  #
  # TIER_LIMITS and DEFAULT_TIER are declared from the SAME expressions the anchor uses, and for
  # one reason only: the verifier's bootstrap asserts the LIVE table (read from
  # `GET /api/v1/admin/tiers`) against the CONFIGURED one before any check runs. Every ceiling the
  # harness grades against comes from that live table — which is right, because it is the only
  # source that reflects a tier changed at runtime — but on its own it is a closed loop: a
  # regression in the seed/store/decode path that fell back to built-in defaults would be reported
  # by the admin API and enforced by the limiter identically, and all 14 checks would pass against
  # limits nobody configured. These two variables are the second, independent view that closes it.
  # If they are ever removed, that assertion silently starts comparing the shipped defaults with
  # themselves.
  #
  # TIER_CACHE_TTL_SEC stays undeclared: the verifier reads the TTL from the live admin API because
  # what matters there is what the replicas are actually caching for, and it bounds the wait with
  # its OWN absolute ceiling (E2E_TIER_MAX_WAIT_SEC) rather than with the server's number — see
  # that gate below.
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: [e2e]
    environment:
      - TARGET_URL=http://lb:80
      - DIRECT_URL=http://api1:8000
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-signing-key-0123456789abcdef}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-dev-only-insecure-pepper-0123456789abcdef}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-only-insecure-admin-token-0123456789abcdef}
      - "TIER_LIMITS=${TIER_LIMITS:-free:60:60:1000:25000,premium:300:300:50000:1250000,enterprise:1000:1000:500000:12500000}"
      - DEFAULT_TIER=${DEFAULT_TIER:-free}
      - E2E_READY_TIMEOUT=${E2E_READY_TIMEOUT:-90}
      - E2E_REPLICA_PROBES=${E2E_REPLICA_PROBES:-20}
      # ~3.3x the free tier's capacity of 60, at a concurrency high enough that nginx has to fan
      # the burst out. A burst that is not comfortably larger than capacity cannot tell a shared
      # bucket from two per-process ones — which is why `E2E_BURST_REQUESTS=1 make e2e` MUST fail.
      - E2E_BURST_REQUESTS=${E2E_BURST_REQUESTS:-200}
      - E2E_BURST_CONCURRENCY=${E2E_BURST_CONCURRENCY:-50}
      - E2E_RATE_LIMIT_MARGIN=${E2E_RATE_LIMIT_MARGIN:-30}
      - E2E_QUOTA_LIMIT=${E2E_QUOTA_LIMIT:-3}
      - E2E_TIER_RPM=${E2E_TIER_RPM:-137}
      - E2E_TIER_SLACK_SEC=${E2E_TIER_SLACK_SEC:-5}
      # An ABSOLUTE ceiling on tier convergence, and it is the gate that keeps check 11 honest.
      # The relative budget (TIER_CACHE_TTL_SEC + slack) is read from the live admin API, so on its
      # own it scales with the very mechanism under test — propagation IS TTL expiry, there is no
      # pub/sub in src/tiers.py. Measured: at TIER_CACHE_TTL_SEC=45 the slow replica took 32.7s and
      # the check PASSED, because the budget had widened to 50s with it. The tighter of the two
      # bounds wins, so `TIER_CACHE_TTL_SEC=45 make e2e` MUST now exit non-zero: a stack configured
      # to converge more slowly than the harness tolerates is the finding, not the excuse.
      - E2E_TIER_MAX_WAIT_SEC=${E2E_TIER_MAX_WAIT_SEC:-15}
      - E2E_ANALYTICS_REQUESTS=${E2E_ANALYTICS_REQUESTS:-12}
      - E2E_ANALYTICS_UNAUTH=${E2E_ANALYTICS_UNAUTH:-5}
      - E2E_ANALYTICS_TIMEOUT=${E2E_ANALYTICS_TIMEOUT:-20}
      - E2E_STATS_MINUTES=${E2E_STATS_MINUTES:-60}
      - E2E_LATENCY_SAMPLES=${E2E_LATENCY_SAMPLES:-40}
      # The limiter's ADDED latency, measured black-box as metered p95 minus exempt p95 on the same
      # stack. `MAX_OVERHEAD_MS=0 make e2e` MUST exit non-zero — that is how we prove the gate
      # bites rather than decorates. C14 measures the same quantity against a
      # RATE_LIMIT_ENABLED=false baseline and reads its own LOAD_MAX_OVERHEAD_MS.
      - MAX_OVERHEAD_MS=${MAX_OVERHEAD_MS:-5}
    depends_on:
      # All three, and `service_healthy` on every one. The LB alone would not be enough: nginx is
      # healthy as soon as it can reach ONE upstream, and a verifier that started then would fire
      # check 2 (both replicas answer) at a stack where the second replica is still building its
      # Redis pool — a flake that reads as "the load balancer is not fanning out".
      lb:
        condition: service_healthy
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    command: ["python", "-m", "scripts.verify_e2e"]

  # The overhead BASELINE replica (C14 phase C). Profile-gated behind `loadtest`, so it never
  # starts on a bare `docker compose up`, never joins the nginx upstream, and never serves a
  # customer — it exists to be measured against.
  #
  # .. rubric:: Why a whole extra process, rather than the trick C13 used
  #
  # C13's check 14 measures the limiter's cost as `p95(GET /api/v1/whoami) - p95(GET /docs)` and its
  # own docstring says why that is a lower bound rather than a measurement: the two paths run
  # DIFFERENT handlers, so the residual carries whatever those handlers differ by. The clean
  # experiment is the SAME route with enforcement switched off — which cannot be done to a replica
  # that is also serving the metered leg, because `RATE_LIMIT_ENABLED` is read from the environment
  # at startup and there is no runtime switch for it (deliberately: a rate limiter with a live
  # off-button is a rate limiter with a live bypass). So the baseline is a second process.
  #
  # `extends` rather than the `x-api` merge key, and this is the one place in this file where the
  # difference matters. A YAML merge key REPLACES `environment` wholesale, so `<<: *api` plus a
  # one-variable override would mean copying all 29 variables into a second block that a reviewer
  # then has to keep in sync by eye — and a drifted copy here would not fail loudly, it would
  # silently make the baseline incomparable (a different REDIS_URL, a different TIER_LIMITS, and
  # phase C would be subtracting the latency of a different system). `extends` MERGES the
  # environment key by key, so this service is `api1` in every respect with exactly one variable
  # changed, structurally rather than by inspection. `scripts/load_test.py` re-establishes that at
  # runtime before it measures anything: it asserts this replica reports `rate_limit_enabled=false`
  # and emits no `X-RateLimit-*`, and that `api1` reports the opposite.
  #
  # `depends_on` is re-declared rather than inherited: the Compose spec excludes it from what
  # `extends` shares (some versions copy it anyway, which is exactly the sort of thing not to depend
  # on). Without it this container can start against a Redis that is not answering yet — and while
  # the limiter is off here, the app still builds a pool and seeds the demo credentials at startup.
  api-baseline:
    extends:
      service: api1
    profiles: [loadtest]
    environment:
      # THE one variable. With it false, `RateLimitMiddleware` classifies the endpoint and returns:
      # no cost lookup, no identity resolution, no decision script, no analytics write, no headers.
      # So the phase-C delta is the whole enforcement layer's cost, which is what a caller pays.
      - RATE_LIMIT_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy

  # Perf/load harness (C14). Same tester image as `test` and `e2e`, running scripts/load_test.py
  # against the LIVE stack over HTTP only. Profile-gated; run via `make load`.
  #
  # FOUR target URLs, because the four phases ask four different questions and each needs to address
  # a specific part of the topology by name:
  #
  #   * TARGET_URL=http://lb:80                — through the proxy, across BOTH replicas. Phase A's
  #     parallel burst and phase B's throughput number.
  #   * DIRECT_URL=http://api1:8000            — ONE replica. Phase D's single-replica leg, and
  #     phase C's metered leg (no proxy hop on either side of that comparison).
  #   * BASELINE_URL=http://api-baseline:8000  — the RATE_LIMIT_ENABLED=false process above.
  #   * LOAD_REPLICA_URLS=api1,api2            — every real replica, individually, for phase E. RSS
  #     is a property of a PROCESS: read through the round-robin proxy, "before" and "after" would
  #     routinely come from different containers and the growth figure would be a fiction. `lb` and
  #     `api-baseline` are deliberately absent from it — nginx has no /admin surface, and the
  #     baseline replica's memory is not this service's memory.
  #
  # All by SERVICE NAME over the compose network, never via ${API_PORT}: a published host port would
  # make this harness immune to nothing and vulnerable to a sibling project's port collision.
  #
  # The three secrets are declared from the SAME ${VAR:-default} expressions the `x-api` anchor uses:
  # JWT_SECRET because the harness signs its own throwaway principals with src.identity.issue_token
  # (a different key means every token it mints is a forgery and phase A measures 401s), ADMIN_TOKEN
  # because it drives tier assignment and reads the memory probe, and API_KEY_PEPPER because
  # `Settings` REFUSES TO CONSTRUCT without it — omitting it fails the bootstrap before phase A.
  #
  # TIER_LIMITS and DEFAULT_TIER are deliberately NOT declared here, unlike on the `e2e` service.
  # That service needs them because it grades measured ceilings against the configured table; this
  # one grades no ceiling at all — it reads the live table only to size its principal pools so the
  # limiter never refuses a request it is trying to time. Declaring them would imply a cross-check
  # this harness does not perform, and the E2E verifier already owns that assertion.
  loadtest:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: [loadtest]
    environment:
      - TARGET_URL=http://lb:80
      - DIRECT_URL=http://api1:8000
      - BASELINE_URL=http://api-baseline:8000
      - "LOAD_REPLICA_URLS=${LOAD_REPLICA_URLS:-http://api1:8000,http://api2:8000}"
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-signing-key-0123456789abcdef}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-dev-only-insecure-pepper-0123456789abcdef}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-only-insecure-admin-token-0123456789abcdef}
      - LOAD_READY_TIMEOUT=${LOAD_READY_TIMEOUT:-90}
      # Unmeasured traffic to every target before the clock starts. uvicorn's per-connection setup,
      # the Redis pool's lazy connect and the script cache's first EVALSHA miss are one-off costs
      # that would otherwise land inside phase A.
      - LOAD_WARMUP_REQUESTS=${LOAD_WARMUP_REQUESTS:-500}
      # The spec's own number, and its own test: "100 parallel requests via httpx, counting 200s vs
      # 429s". It must stay ABOVE the free tier's ceiling (60) or the burst never provokes a refusal
      # and the harness fails on purpose — `Successful: 100, Rate Limited: 0` is not a pass.
      - LOAD_SPEC_REQUESTS=${LOAD_SPEC_REQUESTS:-100}
      # 20000, not the 5000 the plan pencilled in: that figure assumed ~1000 req/s, and this stack
      # measured ~6000 through the LB, which turns 5000 requests into a 0.8-second sample dominated
      # by connection ramp-up. Three repeats at 5000 spread the scaling ratio over 1.51-1.72x; the
      # same repeats at 20000 spread it over 1.59-1.62x.
      - LOAD_REQUESTS=${LOAD_REQUESTS:-20000}
      # 32 keep-alive connections, not the plan's 100, and the number is REDIS_MAX_CONNECTIONS
      # rather than a taste: phase D's single-replica leg points all of them at ONE replica, which
      # answers each request out of a pool of 32 with a 50 ms wait budget. Offer more and some
      # request is always queueing for a store connection, and the queue lands in the measurement.
      # Measured on that leg: c=100 -> p95 45 ms and 15 x 503 per 8000; c=64 -> 1 x 503 per 20000
      # (a coin flip per run); c=32 -> clean across 3 x 20000, with the replica already saturated
      # (it serves ~4k req/s at 24, 32, 40 and 64 alike). Those 503s are the limiter refusing
      # rather than admitting unmetered — correct behaviour, and exactly why they must not appear
      # inside a throughput number.
      - LOAD_CONCURRENCY=${LOAD_CONCURRENCY:-32}
      # Cores the load generator may consume before its throughput number is declared void. This is
      # the gate that stops this harness from publishing ITS OWN ceiling as the service's: the first
      # three calibration runs did exactly that (569 req/s at 1.00 core, then 1144 at 2.87 — both
      # measurements of httpx, and a scaling factor of 0.94x because a saturated client cannot push
      # harder at two replicas than at one). The generator now costs ~0.05 ms of CPU per request and
      # sits near 0.2 of a core at ~6000 req/s, so 0.8 is a wide berth around a real failure mode.
      - LOAD_MAX_CLIENT_CPU=${LOAD_MAX_CLIENT_CPU:-0.8}
      # Throughput gate: roughly half the measured floor (~5800 req/s through the LB on the
      # calibration host), so a change that costs this service half its throughput fails the run and
      # a busy laptop does not. The spec's figure is 1,000 rps — met about six times over — and is
      # printed separately (`RESULT spec_target_rps`, `RESULT throughput_meets_spec_target`) rather
      # than being restated as a gate. `LOAD_MIN_RPS=1000000 make load` MUST fail.
      - LOAD_MIN_RPS=${LOAD_MIN_RPS:-3000}
      - LOAD_OVERHEAD_SAMPLES=${LOAD_OVERHEAD_SAMPLES:-200}
      # The limiter's ADDED p95, measured against `api-baseline` — the same route on the same image
      # with RATE_LIMIT_ENABLED=false. This is the honest version of C13's MAX_OVERHEAD_MS, which
      # differenced two different handlers; the spec asks for <5ms and this is that number.
      # `LOAD_MAX_OVERHEAD_MS=0 make load` MUST exit non-zero.
      - LOAD_MAX_OVERHEAD_MS=${LOAD_MAX_OVERHEAD_MS:-5}
      # Empty by default, and the harness reads an empty value as "use LOAD_REQUESTS". Spelled this
      # way rather than repeating 5000, so lowering LOAD_REQUESTS for a quick run cannot leave
      # phase D still firing the original volume.
      - LOAD_SCALING_REQUESTS=${LOAD_SCALING_REQUESTS:-}
      # Two replicas over ONE Redis cannot reach 2.0x: every metered request runs a Lua script on a
      # single-threaded server, so that section is serialised across the whole cluster. ~1.5x is
      # what "it scales, and the shared store is the ceiling" looks like, and a run reporting 2.0x
      # would mean the decision had stopped serialising — i.e. the per-process bucket this project
      # exists to prevent. Measured: 1.56x and 1.61x in the shipped arrangement, inside a 1.40-1.72x
      # band across twenty-two legs at four concurrency settings. The gate is 1.30 rather than the
      # plan's 1.5 because 1.5 sits INSIDE that spread (a sequential run measured 1.404) and would
      # flake — and a gate nobody trusts gets raised until it passes, at which point it is
      # decoration. The harness interleaves the two legs in alternating chunks so a slow patch of
      # machine time lands on both; run sequentially the single-replica leg always went first, in
      # the quietest window, and the ratio came out 1.40-1.54x for that reason alone.
      - LOAD_MIN_SCALING=${LOAD_MIN_SCALING:-1.30}
      # Measured: each replica sits at ~66 MiB RSS both at rest and after the run. 150 is a ceiling
      # for the process (2.2x the measurement), not a prediction of it — tight enough that an
      # in-process cache someone adds later has to justify itself.
      # `MAX_BACKEND_MEM_MB=1 make load` MUST fail.
      - MAX_BACKEND_MEM_MB=${MAX_BACKEND_MEM_MB:-150}
      # "Stable memory usage under sustained load", as a number. Every bucket, counter and window
      # this service keeps lives in Redis, so a replica that grows across ~62k requests and ~125
      # fresh principals is keeping per-caller state it should not have. Measured growth:
      # 0.7 MiB. At 25 the gate still catches a per-request leak of ~400 bytes.
      - MAX_MEM_GROWTH_MB=${MAX_MEM_GROWTH_MB:-25}
    depends_on:
      # All four, `service_healthy` on every one. `lb` alone is not enough (nginx is healthy as soon
      # as it can reach ONE upstream, so phase D's two-replica leg could start against a stack that
      # is still half up), and `api-baseline` has to be waited on explicitly or phase C's first
      # sample races its startup.
      lb:
        condition: service_healthy
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api-baseline:
        condition: service_healthy
    command: ["python", "-m", "scripts.load_test"]

volumes:
  # Named rather than a bind mount: the AOF is Redis's own on-disk format and has no business in
  # the source tree (it would land in the build context and in git status). `make clean` and the
  # test targets drop it with `down -v`.
  redis-data:
