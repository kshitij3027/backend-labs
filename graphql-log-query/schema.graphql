input CreateLogInput {
  service: String!
  level: LogLevel!
  message: String!
  timestamp: DateTime = null
  metadata: JSON = null
  traceId: String = null
}

"""
The createOrderEvent payload — one transition in an order's lifecycle. `orderId`, `userId` and `status` are the event; `service` defaults to the order service and `level` is derived from the status (CANCELLED and REFUNDED are WARNING, the rest INFO) so a caller states only what it actually knows.
"""
input CreateOrderEventInput {
  orderId: String!
  userId: String!
  status: OrderStatus!
  service: String = null
  level: LogLevel = null
  timestamp: DateTime = null
  metadata: JSON = null
  traceId: String = null
}

"""Date with time (isoformat)"""
scalar DateTime

"""
How many distinct orders have EVER reached one status. Cumulative rather than current, so an order that was delivered is counted at every stage it passed through — which is what makes this a funnel and makes `share` a conversion rate.
"""
type FunnelStage {
  status: OrderStatus!
  ordersReached: Int!
  share: Float!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type LevelCount {
  level: LogLevel!
  count: Int!
}

type LogConnection {
  edges: [LogEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LogEdge {
  cursor: String!
  node: LogEntry!
}

type LogEntry implements LogEvent {
  timestamp: DateTime!
  service: String!
  level: LogLevel!
  traceId: String
  id: ID!
  message: String!
  metadata: JSON

  """
  Every OTHER entry sharing this entry's traceId, newest first. The entry itself is deliberately excluded: a uniquely-traced entry would otherwise answer with itself, which is not what any caller means by 'related'. Empty when traceId is null. Batched across the whole selection set by a per-operation DataLoader, so N entries cost one query rather than N.
  """
  relatedLogs: [LogEntry!]!
}

"""
The correlation envelope every event in this system carries, whatever kind of event it is: when it happened, which service emitted it, how severe it was, and the trace id that ties it to everything else in the same unit of work. Implemented by LogEntry, OrderEvent, PaymentEvent and UserEvent, so a single selection with inline fragments can return a heterogeneous timeline — see Query.correlatedEvents.
"""
interface LogEvent {
  timestamp: DateTime!
  service: String!
  level: LogLevel!
  traceId: String
}

input LogFilterInput {
  service: String = null
  level: LogLevel = null
  startTime: DateTime = null
  endTime: DateTime = null
  searchText: String = null
  limit: Int = null
}

enum LogLevel {
  DEBUG
  INFO
  WARNING
  ERROR
  CRITICAL
}

type LogStats {
  totalLogs: Int!
  errorCount: Int!
  services: [String!]!
  serviceBreakdown: [ServiceCount!]!
  levelBreakdown: [LevelCount!]!
  earliest: DateTime
  latest: DateTime
}

type Mutation {
  createLog(logData: CreateLogInput!): LogEntry!

  """
  Append one status transition to an order's history and return it. This is the event source for `orderStatusStream`: the row is committed FIRST and published to subscribers second, so a streamed transition is always one that durably happened. `service` defaults to the order service and `level` is derived from the status when they are omitted.
  """
  createOrderEvent(orderData: CreateOrderEventInput!): OrderEvent!
}

"""
One transition in an order's lifecycle. Orders are stored as an append-only event stream, so an order's current state is the status of its newest event rather than a mutable column — which is what makes the whole history queryable and what orderStatusStream replays.
"""
type OrderEvent implements LogEvent {
  timestamp: DateTime!
  service: String!
  level: LogLevel!
  traceId: String
  id: ID!
  orderId: String!
  userId: String!
  status: OrderStatus!
  metadata: JSON

  """
  Every payment event filed under this order, newest first — the order -> payments relationship. Batched across the whole selection set by a per-operation DataLoader, so a page of N orders costs one query rather than N. Empty when the order has no payment events.
  """
  payments: [PaymentEvent!]!

  """
  Everything the user who placed this order did, newest first — the order -> user relationship, traversed to that user's activity stream. There is no `users` table to join to (this system stores events, not entities), so `userId` IS the edge and this field is the batched read across it.
  """
  userActivity: [UserEvent!]!

  """
  The log lines emitted under this event's traceId, newest first. Empty when traceId is null. This is the fourth leg of the correlation: order status, payments, user activity and the raw log output of the same unit of work, in one request.
  """
  relatedLogs: [LogEntry!]!
}

"""Filters for Query.orderEvents. Every field is optional and ANDed."""
input OrderEventFilterInput {
  service: String = null
  level: LogLevel = null
  startTime: DateTime = null
  endTime: DateTime = null
  traceId: String = null
  orderId: String = null
  userId: String = null
  status: OrderStatus = null
  searchText: String = null
  limit: Int = null
}

enum OrderStatus {
  CREATED
  PAID
  PACKED
  SHIPPED
  DELIVERED
  CANCELLED
  REFUNDED
}

"""
How many orders are sitting at one status RIGHT NOW — i.e. how many orders have this as the status of their newest event. Every order appears in exactly one bucket, so these counts sum to the number of orders in the window.
"""
type OrderStatusCount {
  status: OrderStatus!
  orders: Int!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""
One event in a payment's life: authorized, captured, declined or refunded. Several events share one orderId — a payment is a stream, not a record with a status column — so `method` is a property of the attempt and `outcome` is the event's own verb.
"""
type PaymentEvent implements LogEvent {
  timestamp: DateTime!
  service: String!
  level: LogLevel!
  traceId: String
  id: ID!
  orderId: String!
  method: PaymentMethod!
  outcome: PaymentOutcome!
  metadata: JSON

  """
  The current state of the order this payment belongs to — the newest OrderEvent carrying the same orderId, or null when no order event exists for it. Batched by orderId through a per-operation DataLoader.
  """
  order: OrderEvent

  """
  The log lines emitted under this event's traceId, newest first. Empty when traceId is null.
  """
  relatedLogs: [LogEntry!]!
}

"""Filters for Query.paymentEvents. Every field is optional and ANDed."""
input PaymentEventFilterInput {
  service: String = null
  level: LogLevel = null
  startTime: DateTime = null
  endTime: DateTime = null
  traceId: String = null
  orderId: String = null
  method: PaymentMethod = null
  outcome: PaymentOutcome = null
  searchText: String = null
  limit: Int = null
}

enum PaymentMethod {
  CARD
  PAYPAL
  APPLE_PAY
  BANK_TRANSFER
  GIFT_CARD
}

enum PaymentOutcome {
  AUTHORIZED
  CAPTURED
  DECLINED
  REFUNDED
}

"""
One (method, outcome) cell of the payment cross-tabulation. `events` counts payment attempts and `orders` counts the distinct orders behind them, so `events > orders` in a DECLINED cell is retries — which a single count could not express.
"""
type PaymentOutcomeCount {
  method: PaymentMethod!
  outcome: PaymentOutcome!
  events: Int!
  orders: Int!
}

type Query {
  logs(filters: LogFilterInput = null): [LogEntry!]!
  log(id: ID!): LogEntry
  logsConnection(filters: LogFilterInput = null, first: Int = null, after: String = null): LogConnection!
  logStats(startTime: DateTime = null, endTime: DateTime = null): LogStats!

  """
  Order lifecycle events matching every supplied filter, newest first, capped by `limit`. Orders are an append-only stream, so an order's current status is the status of its newest event.
  """
  orderEvents(filters: OrderEventFilterInput = null): [OrderEvent!]!

  """
  User activity events matching every supplied filter, newest first, capped by `limit`.
  """
  userEvents(filters: UserEventFilterInput = null): [UserEvent!]!

  """
  Payment events matching every supplied filter, newest first, capped by `limit`. A payment is a stream of outcomes (authorized, captured, declined, refunded) filed under one orderId, not a single mutable record.
  """
  paymentEvents(filters: PaymentEventFilterInput = null): [PaymentEvent!]!

  """
  Every event of every kind carrying this trace id, newest first — log lines, order status transitions, payment outcomes and user actions in one heterogeneous list. Returns the LogEvent interface, so a client selects per-type fields with inline fragments (`... on OrderEvent { orderId status }`). This is the question a correlation id exists to answer, and answering it in one round trip is what would otherwise take four REST calls.
  """
  correlatedEvents(traceId: String!, limit: Int = null): [LogEvent!]!

  """
  One order event by id, or null when there is no such row. Batched with its siblings by a per-operation DataLoader, so a document naming several under aliases costs one query.
  """
  orderEvent(id: ID!): OrderEvent

  """
  One payment event by id, or null when there is no such row. Batched by id.
  """
  paymentEvent(id: ID!): PaymentEvent

  """
  One user activity event by id, or null when there is no such row. Batched by id.
  """
  userEvent(id: ID!): UserEvent

  """
  How many orders are sitting at each status right now — one bucket per status, in lifecycle order, counted from each order's NEWEST event. Computed in SQL (DISTINCT ON + GROUP BY) and cached in Redis under its own short TTL, because one new order event moves an order between buckets rather than merely incrementing one. `filters.limit` is ignored: an aggregate describes the whole matching set.
  """
  orderStatusDistribution(filters: OrderEventFilterInput = null): [OrderStatusCount!]!

  """
  How many distinct orders have EVER reached each status, in lifecycle order, with each stage's share of the widest one. Cumulative rather than current, so an order counts at every stage it passed through — which is what makes this a conversion funnel. Computed in SQL (COUNT DISTINCT + GROUP BY) and cached under the longest TTL in the system, because the numbers are monotonic and a stale read can only undercount.
  """
  orderFunnel(filters: OrderEventFilterInput = null): [FunnelStage!]!

  """
  The payment method x outcome cross-tabulation, busiest cell first. Each cell carries both the number of payment ATTEMPTS and the number of distinct ORDERS behind them, so retries are visible rather than folded into one number. Computed in SQL (GROUP BY + COUNT DISTINCT) and cached under the shared aggregate TTL.
  """
  paymentOutcomeBreakdown(filters: PaymentEventFilterInput = null): [PaymentOutcomeCount!]!
}

type ServiceCount {
  service: String!
  count: Int!
}

type Subscription {
  """
  Live log entries, pushed over WebSocket as `createLog` commits them. `service` and `level` are applied SERVER-SIDE, before an entry is queued for this subscriber — so a narrow subscription costs neither bandwidth nor queue depth for traffic it did not ask for. Each subscriber gets its own bounded queue: a client that stops reading long enough to fill it is disconnected with a SLOW_CONSUMER error rather than being buffered without limit, so a gap is always reported and never silent.
  """
  logStream(service: String = null, level: LogLevel = null): LogEntry!

  """
  Live order status transitions, pushed over WebSocket as `createOrderEvent` commits them. `orderId`, `status` and `userId` are optional and AND-composed, and all three are applied SERVER-SIDE, before an event is queued for this subscriber — so a board watching one customer's order pays neither bandwidth nor queue depth for every other order in the system. Each subscriber gets its own bounded queue: a client that stops reading long enough to fill it is disconnected with a SLOW_CONSUMER error rather than being buffered without limit, so a gap is always reported and never silent.
  """
  orderStatusStream(orderId: String = null, status: OrderStatus = null, userId: String = null): OrderEvent!
}

enum UserActivity {
  SIGNUP
  LOGIN
  BROWSE
  ADD_TO_CART
  CHECKOUT
  REVIEW
  LOGOUT
}

"""
One thing a user did — signing up, logging in, browsing, adding to cart, checking out, reviewing, logging out. Shares a traceId with the order and payment events from the same session, which is what makes correlatedEvents return a story rather than a list.
"""
type UserEvent implements LogEvent {
  timestamp: DateTime!
  service: String!
  level: LogLevel!
  traceId: String
  id: ID!
  userId: String!
  activityType: UserActivity!
  metadata: JSON

  """
  Every order event this user produced, newest first — the order -> user relationship traversed from the user's side. Batched by userId through a per-operation DataLoader.
  """
  orders: [OrderEvent!]!

  """
  The log lines emitted under this event's traceId, newest first. Empty when traceId is null.
  """
  relatedLogs: [LogEntry!]!
}

"""Filters for Query.userEvents. Every field is optional and ANDed."""
input UserEventFilterInput {
  service: String = null
  level: LogLevel = null
  startTime: DateTime = null
  endTime: DateTime = null
  traceId: String = null
  userId: String = null
  activityType: UserActivity = null
  searchText: String = null
  limit: Int = null
}
