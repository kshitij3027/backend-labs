[pytest]
testpaths = tests
addopts = -q --tb=short
asyncio_mode = auto
# Pin the fixture event-loop scope now rather than inheriting a default that changes
# under us: pytest-asyncio 0.24 warns that a future release flips this to `function`.
# Nothing depends on it yet, but C2 introduces async DB fixtures and the scope becomes
# load-bearing the moment one of them is session-scoped.
asyncio_default_fixture_loop_scope = function
